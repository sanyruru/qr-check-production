<!DOCTYPE html>
<!--
================================================================
  原料照合システム（check_yuru.html）

  ★★★ このファイルを直したら、APP_VERSION も必ず新しくすること ★★★

  スクリプトの中ほどにある APP_VERSION の行を探して、
  日付や番号を前と違う値に変えてからコミットしてください。
  （Ctrl+F で「APP_VERSION」と検索すると見つかります）

  変え忘れると、現場のスマホは「同じ版だ」と判断して更新しません。
  中身は直っているのに、現場では古いまま使われ続けます。
  （iPhoneはホーム画面に追加した時点の版を保存し続けるため）

  直したあとの確認方法：
  端末でアプリを開き、画面上部の版数の表示が新しくなっていればOK。
================================================================
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<!-- iPhoneでホーム画面に追加したとき、専用モード（standalone）で開くと
     カメラの読み取りや効果音が正常に動かないため、この指定はあえて外している。
     アイコンから開いてもSafariと同じ動作になる（上下にバーが出るが確実に動く）。
     <meta name="apple-mobile-web-app-capable" content="yes">  ← 復活させないこと
     ※Androidは standalone でも問題なく動くため、上の指定は残している。 -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>原料照合チェック</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<!-- 原料一覧は ingredients.js（全ツール共通）から読む。
     開くたびに最新を取りに行き、通信できない時は前回の控え（端末内）を使う。 -->
<script>document.write('<script src="ingredients.js?t=' + Date.now() + '"><\/script>');</script>
<script>
if (!window.INGREDIENT_MASTER) {
  try { window.INGREDIENT_MASTER = JSON.parse(localStorage.getItem('ingredientMasterCache')); } catch (e) {}
  if (!window.INGREDIENT_MASTER) {
    window.INGREDIENT_MASTER = [];
    alert('原料一覧（ingredients.js）を読み込めませんでした。\n電波の良い場所で開き直してください。');
  }
}
</script>
<style>
  :root {
    --green: #2d6a4f; --green-light: #52b788; --green-pale: #d8f3dc;
    --red: #c1121f; --red-pale: #ffe8e8; --blue: #1a5276;
    --bg: #f4f1eb; --surface: #ffffff; --text: #1a1a1a; --muted: #888; --border: #e0dbd0;
    --orange: #e76f00;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); min-height: 100vh; padding: 16px; }

  .btn-scan.stop { background: var(--muted); }

  @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
  .result-icon { font-size: 52px; margin-bottom: 10px; display: block; }

  .result-name { font-size: 18px; font-weight: 700; opacity: 0.9; }
  .result-msg { font-size: 14px; opacity: 0.8; margin-top: 8px; line-height: 1.5; }

  .amount-card { background: var(--green-pale); border-radius: 14px; padding: 16px; border: 1.5px solid var(--green-light); margin-bottom: 16px; text-align: center; }
  .amount-label { font-size: 11px; font-weight: 700; color: var(--green); letter-spacing: 0.1em; margin-bottom: 4px; }
  .amount-value { font-size: 40px; font-weight: 900; color: var(--green); font-family: monospace; }

  .card { background: var(--surface); border-radius: 14px; padding: 16px; border: 1px solid var(--border); margin-bottom: 16px; }
  .card-title { font-size: 11px; font-weight: 700; letter-spacing: 0.15em; color: var(--muted); margin-bottom: 12px; }
  .detail-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .detail-row:last-child { border-bottom: none; }
  .detail-label { color: var(--muted); }
  .detail-value { font-weight: 500; color: var(--text); font-family: monospace; }

  .progress-header { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .progress-bar { height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; margin-bottom: 12px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--green-light), var(--green)); border-radius: 99px; transition: width 0.5s ease; }
  .ingredient-list { display: flex; flex-direction: column; gap: 6px; }
  .ingredient-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--bg); border-radius: 8px; border: 1.5px solid var(--border); font-size: 12px; }
  .ingredient-item.checked { background: var(--green-pale); border-color: var(--green-light); }
  .ingredient-item.pending { background: #fff8f0; border-color: var(--orange); }
  .ingredient-check { width: 22px; height: 22px; border-radius: 50%; background: var(--border); display: flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; color: var(--muted); }
  .ingredient-item.checked .ingredient-check { background: var(--green); color: white; }
  .ingredient-item.pending .ingredient-check { background: var(--orange); color: white; }
  .ingredient-info { flex: 1; }
  .ingredient-name { font-weight: 500; color: var(--text); }
  .ingredient-amount { font-size: 11px; color: var(--muted); font-family: monospace; }

  .log-item { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
  .log-item:last-child { border-bottom: none; }
  .log-badge { padding: 2px 7px; border-radius: 20px; font-size: 10px; font-weight: 700; flex-shrink: 0; }
  .log-badge.ok { background: var(--green-pale); color: var(--green); }
  .log-badge.ng { background: var(--red-pale); color: var(--red); }
  .log-text { flex: 1; color: var(--text); }
  .log-time { color: var(--muted); font-family: monospace; font-size: 11px; }
  .empty-log { text-align: center; color: var(--muted); font-size: 13px; padding: 12px; }

  .complete-banner { background: var(--green); border-radius: 16px; padding: 24px; text-align: center; margin-bottom: 16px; animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .complete-banner .big { font-size: 48px; margin-bottom: 8px; }
  .complete-banner h2 { font-size: 20px; font-weight: 900; color: white; }
  .complete-banner p { font-size: 13px; color: rgba(255,255,255,0.8); margin-top: 4px; }

  .btn-complete { width: 100%; padding: 18px; background: var(--green); border: none; border-radius: 14px; font-size: 17px; font-weight: 700; color: white; cursor: pointer; margin-bottom: 8px; letter-spacing: 0.05em; -webkit-appearance: none; }
  .btn-reset { width: 100%; padding: 14px; background: var(--surface); border: 2px solid var(--border); border-radius: 12px; font-size: 14px; font-weight: 500; color: var(--muted); cursor: pointer; margin-bottom: 8px; -webkit-appearance: none; }

  .wait-card { background: var(--surface); border-radius: 14px; padding: 28px; text-align: center; border: 1px solid var(--border); margin-bottom: 16px; }
  .wait-icon { font-size: 48px; margin-bottom: 12px; }
  .wait-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; color: var(--text); }
  .wait-sub { font-size: 13px; color: var(--muted); line-height: 1.6; }

  /* 警告モーダル */
  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal { background: white; border-radius: 16px; padding: 24px; margin: 16px; text-align: center; max-width: 320px; width: 100%; }
  .modal-icon { font-size: 48px; margin-bottom: 12px; }
  .modal-title { font-size: 18px; font-weight: 900; color: var(--orange); margin-bottom: 8px; }
  .modal-msg { font-size: 14px; color: var(--text); line-height: 1.6; margin-bottom: 20px; }
  .modal-btn { width: 100%; padding: 14px; background: var(--orange); border: none; border-radius: 12px; font-size: 15px; font-weight: 700; color: white; cursor: pointer; }

  /* 視覚フラッシュ（音が鳴らせない環境向けの補助フィードバック） */
  #flash {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none; z-index: 50; opacity: 0;
  }
  #flash.ok  { animation: flashGreen 0.45s forwards; }
  #flash.err { animation: flashRed   0.45s forwards; }
  @keyframes flashGreen {
    0%   { opacity: 1; background: rgba(82, 183, 136, 0.40); }
    100% { opacity: 0; background: rgba(82, 183, 136, 0); }
  }
  @keyframes flashRed {
    0%   { opacity: 1; background: rgba(193, 18, 31, 0.40); }
    100% { opacity: 0; background: rgba(193, 18, 31, 0); }
  }
</style>

<body>

<div class="header">
  <div class="header-brand">原料照合システム</div>
  <div class="header-title">製造管理</div>
  <div class="header-ver" id="appVer"></div>
</div>

<div class="scanner-card">
  <div class="card-title">QRスキャナー</div>
  <div id="reader" class="hidden"></div>
  <button id="scanToggleBtn" class="btn-scan" onclick="toggleScanning()">📷 スキャン開始</button>
  <div class="scan-hint">枠の中に、読み取りたいラベル1枚だけが入るように近づけてください</div>
</div>

<div id="app"></div>
<div id="modal"></div>
<div id="flash"></div>

<script>
// 会社全体の原料マスター（名前・棚番）。
// 原料一覧表-20260717.xls「全原料（Op）」シートから自動生成（全378件）。
// 新しい原料が増えたらここに追加するだけでOK
// 原料一覧は ingredients.js（全ツール共通）で管理する
const MASTER_INGREDIENTS = {};
INGREDIENT_MASTER.forEach(([op, name, shelf]) => { MASTER_INGREDIENTS[op] = { name, shelf }; });

// 現在読み込んでいる製品（製造指示書QRを読むたびに入れ替わる）
// 形式: { code, name, ingredients: { '00135': 60.0, '00223': 39.699, ... } }
let currentProduct = JSON.parse(localStorage.getItem('cp') || 'null');

// 製造指示書QRの中身を解析する。
// 例: "CP0727,ユルナチュール,00135:60.0,00223:39.699,00893:0.1,00894:0.001,00082:0.2"
// 解析できなければ null を返す（＝製造指示書QRではない＝原料QRとして扱う）
function parseInstructionCode(raw) {
  if (!raw.includes(',') || !raw.includes(':')) return null;
  const parts = raw.split(',');
  if (parts.length < 2) return null;
  const code = parts[0].trim();
  const name = parts[1].trim();
  const ingredients = {};
  for (let i = 2; i < parts.length; i++) {
    const [ingCode, pctStr] = parts[i].split(':');
    if (!ingCode || pctStr === undefined) continue;
    const pct = parseFloat(pctStr);
    if (!isNaN(pct)) ingredients[ingCode.trim()] = pct;
  }
  if (Object.keys(ingredients).length === 0) return null;
  return { code, name, ingredients };
}

function getBatchKg() {
  const v = localStorage.getItem('bk');
  return v ? parseFloat(v) : null;
}
function setBatchKg(kg) {
  localStorage.setItem('bk', String(kg));
}
function formatGrams(num) {
  let rounded = Math.round(num * 100) / 100;
  let parts = rounded.toString().split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return parts.join('.') + 'g';
}
function computeAmount(code) {
  const kg = getBatchKg();
  if (!currentProduct || kg === null) return '―';
  const pct = currentProduct.ingredients[code];
  if (pct === undefined) return '―';
  const totalGrams = kg * 1000;
  return formatGrams(totalGrams * pct / 100);
}

/* ─────────────────────────────────────────
   トレーサビリティ記録（GAS経由でGoogleスプレッドシートへ）
   ※ GAS_URL は、GASをウェブアプリとしてデプロイした後に発行される
     URL（.../exec で終わるもの）に書き換えてください。
     空欄のままなら何もせず無視されます。
───────────────────────────────────────── */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbz6WE4TdvEGCsIPRxMAUC1OWWUxQ5ORr7utzEvR__nW_BefNw29ON6whGmDBNfQxSm7bw/exec'; // 例: 'https://script.google.com/macros/s/xxxxx/exec'

function logToSheet(ingredientName, ingredientCode, result, ingredientAmount) {
  if (!GAS_URL) return; // 未設定なら何もしない
  const payload = {
    datetime: new Date().toLocaleString('ja-JP'),
    productCode: currentProduct ? currentProduct.code : '',
    productName: currentProduct ? currentProduct.name : '',
    batchKg: getBatchKg() || '',
    ingredientName,
    ingredientCode,
    ingredientAmount: ingredientAmount || '',
    result,
    lotNumber:   window._lastScanLot  || '',
    receiveDate: window._lastScanRecv || ''
  };
  // GASのウェブアプリはCORSに対応していないため mode:'no-cors' で送信
  // （送信結果は読み取れないが、記録自体は正常に行われる）
  fetch(GAS_URL, {
    method: 'POST',
    mode: 'no-cors',
    body: JSON.stringify(payload)
  }).catch(() => {});
}

let checkedCodes = JSON.parse(localStorage.getItem('cc') || '[]');
let logs         = JSON.parse(localStorage.getItem('lg') || '[]');
let pendingCode  = localStorage.getItem('pc') || null;
let pendingName  = localStorage.getItem('pn') || null;

function save() {
  localStorage.setItem('cc', JSON.stringify(checkedCodes));
  localStorage.setItem('lg', JSON.stringify(logs));
}
function savePending(code, name) {
  pendingCode = code; pendingName = name;
  localStorage.setItem('pc', code); localStorage.setItem('pn', name);
}
function clearPending() {
  pendingCode = null; pendingName = null;
  localStorage.removeItem('pc'); localStorage.removeItem('pn');
}


/* ─────────────────────────────────────────
   効果音（Web Audio API・音声ファイル不要）
───────────────────────────────────────── */
let _actx = null;
function getAudioCtx() {
  if (!_actx) {
    try { _actx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { return null; }
  }
  return _actx;
}
async function resumeCtx(ctx) {
  if (ctx && ctx.state === 'suspended') {
    try { await ctx.resume(); } catch (e) {}
  }
}
function beep(ctx, {freq, duration, type = 'sine', gain = 0.3, delay = 0}) {
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  g.gain.value = gain;
  osc.connect(g);
  g.connect(ctx.destination);
  osc.start(ctx.currentTime + delay);
  osc.stop(ctx.currentTime + delay + duration);
}
async function playOkSound() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  await resumeCtx(ctx);
  try {
    beep(ctx, {freq: 880,  duration: 0.12, gain: 0.25});
    beep(ctx, {freq: 1320, duration: 0.15, gain: 0.25, delay: 0.12});
  } catch (e) {}
}
async function playNgSound() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  await resumeCtx(ctx);
  try { beep(ctx, {freq: 160, duration: 0.35, type: 'sawtooth', gain: 0.3}); } catch (e) {}
}
// 「照合済み」（2回目以降の同じ原料）専用：控えめな単音「ポン」
async function playAlreadySound() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  await resumeCtx(ctx);
  try { beep(ctx, {freq: 600, duration: 0.15, type: 'sine', gain: 0.15}); } catch (e) {}
}
// 製造指示書を読み込んだ時専用：3音の軽快なチャイム（矩形波でOK音とは違う質感に）
async function playLoadedSound() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  await resumeCtx(ctx);
  try {
    beep(ctx, {freq: 523, duration: 0.1,  type: 'square', gain: 0.18, delay: 0});
    beep(ctx, {freq: 659, duration: 0.1,  type: 'square', gain: 0.18, delay: 0.1});
    beep(ctx, {freq: 784, duration: 0.2,  type: 'square', gain: 0.2,  delay: 0.2});
  } catch (e) {}
}
// 全原料の照合が完了した時専用：ちょっと華やかなファンファーレ
async function playCompleteSound() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  await resumeCtx(ctx);
  try {
    // ドミソド（上昇アルペジオ）→ 最後にちょっと伸ばして華やかに
    beep(ctx, {freq: 523.25, duration: 0.14, type: 'triangle', gain: 0.22, delay: 0});
    beep(ctx, {freq: 659.25, duration: 0.14, type: 'triangle', gain: 0.22, delay: 0.14});
    beep(ctx, {freq: 783.99, duration: 0.14, type: 'triangle', gain: 0.22, delay: 0.28});
    beep(ctx, {freq: 1046.5, duration: 0.45, type: 'triangle', gain: 0.28, delay: 0.42});
    // 少し厚みを出すための下のハモリ
    beep(ctx, {freq: 523.25, duration: 0.45, type: 'sine', gain: 0.15, delay: 0.42});
  } catch (e) {}
}

/* ─────────────────────────────────────────
   フィードバック（視覚フラッシュ＋できる時は音）
───────────────────────────────────────── */
function setFeedback(type) {
  localStorage.setItem('fb', type);
  // 同一ページ内（ライブスキャン時）はその場で即座に鳴らす
  if (type === 'ng') playNgSound();
  else if (type === 'already') playAlreadySound();
  else if (type === 'loaded') playLoadedSound();
  else if (type === 'complete') playCompleteSound();
  else playOkSound();
}

window.addEventListener('load', function () {
  const fb = localStorage.getItem('fb');
  if (!fb) return;
  localStorage.removeItem('fb');

  const el = document.getElementById('flash');
  if (!el) return;
  el.className = '';
  void el.offsetWidth;
  el.className = (fb === 'ok' || fb === 'loaded' || fb === 'complete' || fb === 'already') ? 'ok' : 'err';
});

/* ─────────────────────────────────────────
   判定ロジック（コード1つを受け取って処理する共通関数）
───────────────────────────────────────── */
function handleCode(code) {
  if (!code) return;
  code = code.trim();

  // 製造指示書QRかどうか判定（"コード,製品名,原料コード:割合,..." の形式）
  const parsedProduct = parseInstructionCode(code);
  if (parsedProduct) {
    const isSameProduct = currentProduct && currentProduct.code === parsedProduct.code;
    currentProduct = parsedProduct;
    localStorage.setItem('cp', JSON.stringify(parsedProduct));
    if (!isSameProduct) {
      // 別の製品に切り替わった場合のみ、進捗・生産量をリセットする
      checkedCodes = []; logs = [];
      pendingCode = pendingName = null;
      save(); clearPending();
      localStorage.removeItem('bk');
    }
    setFeedback('loaded');
    if (getBatchKg() === null) {
      renderBatchInput();
    } else {
      renderProductLoaded();
    }
    return;
  }

  if (!currentProduct) { renderProductScan(); return; }

  if (pendingCode && pendingCode !== code) {
    showWarning(pendingName);
    const master = MASTER_INGREDIENTS[pendingCode];
    if (master) renderOK(master.name, pendingCode, master.shelf, computeAmount(pendingCode), false, false);
    return;
  }

  const master = MASTER_INGREDIENTS[code];
  const belongsToProduct = currentProduct.ingredients[code] !== undefined;
  const time = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

  if (master && belongsToProduct) {
    const already = checkedCodes.includes(code);
    if (already) {
      logs.unshift({ result: 'ok', name: master.name, code, time });
      save();
      setFeedback('already');
      renderOK(master.name, code, master.shelf, computeAmount(code), true, false);
    } else {
      savePending(code, master.name);
      setFeedback('ok');
      logToSheet(master.name, code, 'OK', computeAmount(code));
      renderOK(master.name, code, master.shelf, computeAmount(code), false, false);
    }
  } else {
    const errName = master ? master.name : '不明な原料';
    logs.unshift({ result: 'ng', name: errName, code, time });
    save();
    setFeedback('ng');
    logToSheet(errName, code, 'NG', '―');
    renderError(code);
  }
}

// 従来通り：URLの ?d= パラメータから起動する経路（そのまま残す）
function processURL() {
  const params = new URLSearchParams(window.location.search);
  const d = params.get('d');
  if (!d) { renderWait(); return; }
  handleCode(d.trim());
}

/* ─────────────────────────────────────────
   ページ内カメラスキャン（html5-qrcode）
───────────────────────────────────────── */
let html5QrCode = null;
let scanning = false;
let lastScanCode = null;
let pendingConfirmCode = null;
let pendingConfirmCount = 0;
const CONFIRM_THRESHOLD = 3; // 同じコードが3回連続で読めたら確定（隣のQRの映り込み対策）

// フリーズ監視用（カメラ映像は動いているのに内部で反応が止まるケースの対策）
let lastFrameTime = Date.now();
let isAutoRestarting = false;

// ピンチズーム用（対応端末のみ有効。iPhoneのブラウザは非対応）
let zoomSupported = false;
let zoomMin = 1;
let zoomMax = 1;
let currentZoom = 1;
let pinchStartDistance = null;
let zoomAtPinchStart = 1;

function extractCodeFromScan(decodedText) {
  try {
    const url = new URL(decodedText);
    const d = url.searchParams.get('d');
    if (d) {
      // ロット番号・受入日もURLパラメータから取得して保持する
      const lot  = url.searchParams.get('lot')  || '';
      const recv = url.searchParams.get('recv') || '';
      if (lot || recv) {
        window._lastScanLot  = lot;
        window._lastScanRecv = recv;
      } else {
        window._lastScanLot  = '';
        window._lastScanRecv = '';
      }
      return d.trim();
    }
  } catch (e) {}
  window._lastScanLot  = '';
  window._lastScanRecv = '';
  return decodedText.trim();
}

async function toggleScanning() {
  if (isAutoRestarting) return; // 自動復帰処理中は手動タップを無視（二重起動防止）

  // iPhone(Safari)対策①：ボタンをタップした瞬間に音の準備をしておく
  const ctx = getAudioCtx();
  await resumeCtx(ctx);

  if (scanning) {
    await stopScanning();
    return;
  }
  const readerEl = document.getElementById('reader');
  const btn = document.getElementById('scanToggleBtn');
  readerEl.classList.remove('hidden');

  html5QrCode = new Html5Qrcode("reader");
  try {
    await html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 150, height: 150 } },
      (decodedText) => {
        lastFrameTime = Date.now();
        const code = extractCodeFromScan(decodedText);

        // すでに確定済みの同じQRなら何もしない
        if (code === lastScanCode) { pendingConfirmCode = null; pendingConfirmCount = 0; return; }

        // 隣のQRが一瞬映り込んだだけの誤検知を防ぐため、
        // 同じ新しいコードが連続で読めた時だけ「本当に読んだ」と確定する
        if (code === pendingConfirmCode) {
          pendingConfirmCount++;
        } else {
          pendingConfirmCode = code;
          pendingConfirmCount = 1;
        }

        if (pendingConfirmCount >= CONFIRM_THRESHOLD) {
          lastScanCode = code;
          pendingConfirmCode = null;
          pendingConfirmCount = 0;
          handleCode(code);
        }
      },
      () => {
        // QRが見つからないフレームが挟まると誤検知の元になるので、確定待ちをリセット
        lastFrameTime = Date.now();
        pendingConfirmCode = null;
        pendingConfirmCount = 0;
      }
    );
    scanning = true;
    lastFrameTime = Date.now();
    btn.textContent = '⏹ スキャン停止';
    btn.classList.add('stop');

    // ズーム対応チェック（対応している端末だけピンチズームを有効にする）
    zoomSupported = false;
    try {
      const capabilities = html5QrCode.getRunningTrackCapabilities();
      if (capabilities && capabilities.zoom) {
        zoomMin = capabilities.zoom.min;
        zoomMax = capabilities.zoom.max;
        currentZoom = zoomMin;
        zoomSupported = true;
      }
    } catch (e) {}

    // iPhone(Safari)対策②：カメラの許可ダイアログが割り込んで
    // 音が止まってしまうことがあるため、起動が完了した直後にもう一度
    // 音の準備をし直す
    await resumeCtx(getAudioCtx());
  } catch (err) {
    alert('カメラを起動できませんでした。\nHTTPSのURLで開いているか、カメラの使用を許可しているか確認してください。\n\nエラー: ' + err);
    readerEl.classList.add('hidden');
  }
}

async function stopScanning() {
  if (html5QrCode) {
    try { await html5QrCode.stop(); await html5QrCode.clear(); } catch (e) {}
  }
  scanning = false;
  lastScanCode = null;
  pendingConfirmCode = null;
  pendingConfirmCount = 0;
  zoomSupported = false;
  currentZoom = 1;
  pinchStartDistance = null;
  document.getElementById('reader').classList.add('hidden');
  const btn = document.getElementById('scanToggleBtn');
  btn.textContent = '📷 スキャン開始';
  btn.classList.remove('stop');
}

/* ─────────────────────────────────────────
   画面ロック・アプリ切り替え後の自動復帰
   （裏に隠れている間にカメラの読み取りが止まってしまうことがあるため、
     画面に戻ってきたタイミングで自動的にスキャンを再起動する）
───────────────────────────────────────── */
let wasScanningBeforeHide = false;

document.addEventListener('visibilitychange', async () => {
  if (document.hidden) {
    // 画面が隠れる直前の状態を覚えておく
    wasScanningBeforeHide = scanning;
  } else {
    // 画面に戻ってきた瞬間、スキャン中だったなら自動で再起動する
    if (wasScanningBeforeHide) {
      wasScanningBeforeHide = false;
      try {
        isAutoRestarting = true;
        await stopScanning();
        await toggleScanning();
      } catch (e) {} finally {
        isAutoRestarting = false;
      }
    }
  }
});

/* ─────────────────────────────────────────
   フリーズ監視（ウォッチドッグ）
   画面を離れていないのに、カメラの読み取り処理自体が
   内部で止まってしまうことがある（iPhoneで時々発生）。
   一定時間、成功・失敗どちらのコールバックも来ない場合は
   「反応が止まっている」とみなし、自動でスキャンを再起動する。
───────────────────────────────────────── */
const FREEZE_TIMEOUT_MS = 8000; // これ以上コールバックが無ければフリーズとみなす

setInterval(async () => {
  if (!scanning || isAutoRestarting || document.hidden) return;
  if (Date.now() - lastFrameTime > FREEZE_TIMEOUT_MS) {
    isAutoRestarting = true;
    try {
      await stopScanning();
      await toggleScanning();
    } catch (e) {} finally {
      isAutoRestarting = false;
    }
  }
}, 3000);

/* ─────────────────────────────────────────
   ピンチズーム（対応端末のみ）
   iPhoneのブラウザ(Safari／Chromeとも)はWeb上から
   カメラズームを操作する機能自体が無いため、対応端末
   （主にAndroidのChrome系）でのみ実際にズームがかかる。
   非対応端末では指で広げても何も起きないだけで、
   エラーや誤動作にはならない。
───────────────────────────────────────── */
function getPinchDistance(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx * dx + dy * dy);
}

const readerElForZoom = document.getElementById('reader');

readerElForZoom.addEventListener('touchmove', async (e) => {
  if (!zoomSupported || e.touches.length !== 2) return;
  e.preventDefault();

  const dist = getPinchDistance(e.touches);
  if (pinchStartDistance === null) {
    pinchStartDistance = dist;
    zoomAtPinchStart = currentZoom;
    return;
  }

  const scale = dist / pinchStartDistance;
  let newZoom = zoomAtPinchStart * scale;
  newZoom = Math.min(zoomMax, Math.max(zoomMin, newZoom));
  currentZoom = newZoom;

  try {
    await html5QrCode.applyVideoConstraints({ advanced: [{ zoom: currentZoom }] });
  } catch (e) {}
}, { passive: false });

readerElForZoom.addEventListener('touchend', (e) => {
  if (e.touches.length < 2) pinchStartDistance = null;
});

// ═══════════════════════════════════════════════════════════
// 製造者QR照合パッチ（v2：複数端末で共有する版）
//
// 仕組み：
//   秤量担当が全原料の秤量を終えて人数を入力すると、GAS側に
//  「今このバッチが進行中」という記録（セッション）を1件作ります。
//   各社員は、自分のDIGNOでこのページを開いて自分の名札QRを読むだけで、
//   その記録に自分の名前を追加できます（製造指示書を読む必要はありません）。
//   人数が揃った瞬間に、揃えた本人の端末でスプレッドシートへ書き込みます。
// ═══════════════════════════════════════════════════════════

/* ─── 設定 ─────────────────────────────────────────────
   製造メンバー。QRコードには "MFR:M01" のように埋め込みます。
   人が増減したらここを直すだけ（QR発行ページも同じ表を使います）。
──────────────────────────────────────────────────────── */
const MANUFACTURERS = {
  'M01': '石坂',
  'M02': '久保',
  'M03': '原田',
  'M04': '真弓',
  'M05': '佐々木D',
  'M06': '佐々木胤人',
};

/* ─── 状態（この端末だけの表示用フラグ。判定の根拠はサーバー側） ─── */
let productionStarted = localStorage.getItem('st') === '1';

function clearMakers() {
  productionStarted = false;
  localStorage.removeItem('st');
  localStorage.removeItem('mn');
}

/* この端末がバッチを開始済みかどうか（＝人数入力を終えたかどうか） */
function getMakerCount() {
  const v = localStorage.getItem('mn');
  return v ? parseInt(v, 10) : null;
}
function setMakerCount(n) {
  localStorage.setItem('mn', String(n));
}

/* 製造者QRかどうかを判定する。
   "MFR:M01" でも "MFR:石坂" でも読めるようにしてあります。 */
function parseManufacturerCode(raw) {
  const m = String(raw).trim().match(/^MFR:(.+)$/i);
  if (!m) return null;
  const v = m[1].trim();
  if (MANUFACTURERS[v]) return { key: v, name: MANUFACTURERS[v] };
  const hitKey = Object.keys(MANUFACTURERS).find(k => MANUFACTURERS[k] === v);
  if (hitKey) return { key: hitKey, name: MANUFACTURERS[hitKey] };
  return { key: v, name: null }; // 登録されていない製造者QR
}

function allIngredientsDone() {
  if (!currentProduct) return false;
  const total = Object.keys(currentProduct.ingredients).length;
  return !pendingCode && checkedCodes.length === total;
}

/* ─── GASへの問い合わせ（結果を読み返す必要があるのでGETを使う） ───
   ※ POST + mode:'no-cors'（原料スキャンの記録などで従来から使っているもの）は
     送信はできても結果を読み返せないため、製造者まわりはすべてGETで統一しています。 */
function gasGet(params) {
  const qs = Object.keys(params)
    .map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k] === undefined || params[k] === null ? '' : params[k]))
    .join('&');
  return fetch(GAS_URL + '?' + qs).then(r => r.json());
}

/* ─── handleCode を差し替え（製造者QRの分岐を追加） ───── */
handleCode = function (code) {
  if (!code) return;
  code = code.trim();

  // ① 製造指示書QR
  const parsedProduct = parseInstructionCode(code);
  if (parsedProduct) {
    const isSameProduct = currentProduct && currentProduct.code === parsedProduct.code;
    currentProduct = parsedProduct;
    localStorage.setItem('cp', JSON.stringify(parsedProduct));
    if (!isSameProduct) {
      checkedCodes = []; logs = [];
      pendingCode = pendingName = null;
      save(); clearPending(); clearMakers();
      localStorage.removeItem('bk');
    }
    setFeedback('loaded');
    if (getBatchKg() === null) renderBatchInput();
    else renderProductLoaded();
    return;
  }

  // ② 製造者QR（現在地・進捗に関係なく、まずここで判定する。
  //    社員のDIGNOには製造指示書が読み込まれていない＝currentProductがnullなので、
  //    このチェックを「currentProductが要る」処理より先に置く必要がある）
  const maker = parseManufacturerCode(code);
  if (maker) {
    handleMakerScan(maker);
    return;
  }

  if (!currentProduct) { renderProductScan(); return; }

  // 製造者確認が完了したあとは、誤スキャン防止のため状態画面を出すだけにする
  if (productionStarted) { renderMakerStep(); return; }

  // ③ 原料QR（ここから下は従来どおり）
  if (pendingCode && pendingCode !== code) {
    showWarning(pendingName);
    const m = MASTER_INGREDIENTS[pendingCode];
    if (m) renderOK(m.name, pendingCode, m.shelf, computeAmount(pendingCode), false, false);
    return;
  }

  const master = MASTER_INGREDIENTS[code];
  const belongsToProduct = currentProduct.ingredients[code] !== undefined;
  const time = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

  if (master && belongsToProduct) {
    const already = checkedCodes.includes(code);
    if (already) {
      logs.unshift({ result: 'ok', name: master.name, code, time });
      save();
      setFeedback('already');
      renderOK(master.name, code, master.shelf, computeAmount(code), true, false);
    } else {
      savePending(code, master.name);
      setFeedback('ok');
      logToSheet(master.name, code, 'OK', computeAmount(code));
      renderOK(master.name, code, master.shelf, computeAmount(code), false, false);
    }
  } else {
    const errName = master ? master.name : '不明な原料';
    logs.unshift({ result: 'ng', name: errName, code, time });
    save();
    setFeedback('ng');
    logToSheet(errName, code, 'NG', '―');
    renderError(code);
  }
};

/* ─── renderOK を差し替え ────────────────────────────
   秤量が全部終わったら「完了バナー」ではなく
   「製造者確認のステップ」へ進むようにする  */
renderOK = function (name, code, shelf, amount, already, measured) {
  const total = Object.keys(currentProduct.ingredients).length;
  if (checkedCodes.length === total && !pendingCode) {
    renderMakerStep();
    return;
  }
  document.getElementById('app').innerHTML = `
    <div class="result-card ok">
      <span class="result-icon">✅</span>
      <div class="result-title">${already ? '照合済み' : 'OK！'}</div>
      <div class="result-name">${name}</div>
      <div class="result-msg">${already ? 'この原料はすでに照合済みです' : '正しい原料です'}</div>
    </div>
    <div class="amount-card">
      <div class="amount-label">必要量（${currentProduct.name}用）</div>
      <div class="amount-value">${amount}</div>
    </div>
    <div class="card">
      <div class="detail-row"><span class="detail-label">OPコード</span><span class="detail-value">${code}</span></div>
      <div class="detail-row"><span class="detail-label">棚番</span><span class="detail-value">${shelf}</span></div>
    </div>
    ${!already && !measured ? `<button class="btn-complete" onclick="completeMeasure('${code}', '${name}')">計量完了 ✅</button>` : ''}
    ${renderProductCard()}
    ${renderProgress()}
    ${renderLog()}
    <button class="btn-reset" onclick="resetAll()">🔄 リセット</button>
  `;
};

/* ─── 本日の製造人数の入力画面（秤量担当の端末でのみ表示） ───── */
function renderMakerCountInput() {

async function confirmMakerCount() {
  const el = document.getElementById('makerCountInput');
  const val = parseInt(el.value, 10);
  if (!val || val < 1) {
    alert('正しい製造人数を入力してください');
    return;
  }

  document.getElementById('app').innerHTML = `
    <div class="wait-card"><div class="wait-icon">📡</div><div class="wait-title">送信中...</div></div>
  `;

  let res;
  try {
    res = await gasGet({
      action: 'session_start',
      productCode: currentProduct.code,
      productName: currentProduct.name,
      batchKg: getBatchKg() || '',
      needed: val
    });
  } catch (e) {
    showMakerModal('サーバーに接続できません', '電波の良い場所でもう一度お試しください');
    renderMakerCountInput();
    return;
  }

  if (!res.success) {
    showMakerModal('送信できませんでした', res.error || 'もう一度お試しください');
    renderMakerCountInput();
    return;
  }

  setMakerCount(val);
  renderMakerWaitScreen(res.session);
}

/* ─── 秤量が終わったあとに出す画面を振り分ける（この端末＝秤量担当の端末専用） ─── */
function renderMakerStep() {
  if (getMakerCount() === null) { renderMakerCountInput(); return; }

  document.getElementById('app').innerHTML = `
    <div class="wait-card"><div class="wait-icon">📡</div><div class="wait-title">状態を確認中...</div></div>
  `;

  gasGet({ action: 'get_session' }).then(res => {
    if (!res.success || !res.session) { renderMakerCountInput(); return; }
    if (res.session.status === 'done') { renderMakerCompleteScreen(res.session); }
    else { renderMakerWaitScreen(res.session); }
  }).catch(() => {
    renderMakerCountInput();
  });
}

/* ─── 名札QRを読んだときの処理（秤量担当の端末・社員のDIGNOの両方から呼ばれる） ─── */
async function handleMakerScan(maker) {
  if (!maker.name) {
    setFeedback('ng');
    showMakerModal(
      '登録されていない名札です',
      `コード：${maker.key}<br>製造メンバーとして登録されていません`
    );
    return;
  }

  document.getElementById('app').innerHTML = `
    <div class="wait-card"><div class="wait-icon">📡</div><div class="wait-title">確認中...</div></div>
  `;

  let res;
  try {
    res = await gasGet({ action: 'session_maker', makerKey: maker.key, makerName: maker.name });
  } catch (e) {
    setFeedback('ng');
    showMakerModal('サーバーに接続できません', '電波の良い場所でもう一度スキャンしてください');
    renderMakerFallbackScreen();
    return;
  }

  if (!res.success) {
    if (res.error === 'already_done') {
      setFeedback('already');
      renderMakerCompleteScreen(res.session);
      return;
    }
    setFeedback('ng');
    if (res.error === 'no_active_session') {
      showMakerModal(
        'まだバッチが始まっていません',
        '秤量担当が本日の製造人数を入力したあとに<br>もう一度名札をスキャンしてください'
      );
    } else {
      showMakerModal('記録できませんでした', 'もう一度スキャンしてください');
    }
    renderMakerFallbackScreen();
    return;
  }

  if (res.completed) {
    renderMakerCompleteScreen(res.session);
  } else if (res.already) {
    setFeedback('already');
    renderMakerWaitScreen(res.session);
  } else {
    setFeedback('ok');
    renderMakerWaitScreen(res.session);
  }
}

/* 名札スキャンがうまくいかなかったときに、状況に応じて戻る先を選ぶ */
function renderMakerFallbackScreen() {
  if (currentProduct) { renderMakerStep(); } else { renderProductScan(); }
}

/* ─── 製造者確認 待ち画面（秤量担当の端末・社員のDIGNOの両方で同じ画面を使う） ─── */
function renderMakerWaitScreen(session) {
  const items = Object.keys(MANUFACTURERS).map(k => {
    const hit = session.makers.find(m => m.key === k);
    return `<div class="ingredient-item ${hit ? 'checked' : ''}">
      <div class="ingredient-check">${hit ? '✓' : ''}</div>
      <div class="ingredient-info">
        <div class="ingredient-name">${MANUFACTURERS[k]}</div>
        <div class="ingredient-amount">${hit ? hit.time + ' 確認' : '未スキャン'}</div>
      </div>
    </div>`;
  }).join('');

  const rest = Math.max(0, session.needed - session.makers.length);
  const pct  = Math.min(100, Math.round((session.makers.length / session.needed) * 100));

  // 秤量担当の端末なら原料の進捗も出す。社員のDIGNOには原料データがないので簡易表示にする
  const productBlock = currentProduct
    ? renderProductCard() + renderProgress() + renderLog()
    : `<div class="product-card">
        <div class="product-icon">🧴</div>
        <div style="flex:1;">
          <div class="product-name">${session.productName}</div>
          <div class="product-sub">${session.productCode} ／ 生産量 ${session.batchKg}kg</div>
        </div>
      </div>`;

  document.getElementById('app').innerHTML = `
    <div class="result-card ok">
      <span class="result-icon">⚖️</span>
      <div class="result-title">秤量完了</div>
      <div class="result-name">${session.productName}</div>
      <div class="result-msg">製造に入るメンバーの名札をスキャンしてください<br>あと ${rest}名で製造を開始できます</div>
    </div>
    <div class="card">
      <div class="card-title">製造者確認</div>
      <div class="progress-header"><span>スキャン済み</span><span>${session.makers.length} / ${session.needed}名</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="ingredient-list">${items}</div>

    ${currentProduct ? `<button class="btn-reset" onclick="cancelSession()">🛑 このバッチをキャンセル</button>` : ''}
    <button class="btn-reset" onclick="resetAll()">🔄 リセット</button>
  `;
}

/* ─── 既存のリセット系に製造者クリアを足す ──────────── */
const _goToStartOrig = goToStart;
goToStart = function () { clearMakers(); _goToStartOrig(); };

const _resetAllOrig = resetAll;
resetAll = function () { clearMakers(); _resetAllOrig(); };

/* ─── 再読み込みしたときに正しい画面へ戻す ───── */
const _renderWaitOrig = renderWait;
renderWait = function () {
  // 製造メンバーのDIGNOには製品データが無い。
  // そのまま元のrenderWaitを呼ぶと currentProduct.name でエラーになり画面が固まるため、
  // ここで最初の画面に戻す（「リセット」を押したときなどに通る）

  if (allIngredientsDone() || productionStarted) { renderMakerStep(); return; }

};

/* ═══════════ 製造者QR照合パッチ（v2）ここまで ═══════════ */

// ═══════════════════════════════════════════════════════════
// 製造方法QR照合パッチ（v4）
//
// 製造方法の紙に貼ったQR（"MTH:CP0727|ユルナチュール|2024.02.20"）を読むと、
// いま読み込んでいる製造指示書のCP番号と突き合わせる。
//   ・同じCP番号 → OK（製造方法 照合済み）
//   ・違うCP番号 → NG（製造方法の紙を取り違えている）
// QRは issue_product_label.html で、指示書用とセットで発行する。
//
// 現場の流れ：製造指示書 → 原料の秤量 → 製造方法QR → 製造人数・名札 → 製造開始
// 秤量が全部終わったら、製造人数の入力の前に「製造方法QRを読む」画面を出す。
// ═══════════════════════════════════════════════════════════

/* ─── 設定 ─────────────────────────────────────────────
   false：製造方法QRの画面に「照合せずに進む」ボタンを出す（QRを貼っていない製品用）
   true ：製造方法QRを照合するまで、製造人数の入力（製造開始）に進めなくする
   全製品の製造方法にQRを貼り終えるまでは false のままにしておくこと。
──────────────────────────────────────────────────────── */
const REQUIRE_METHOD_CHECK = false;

(function () {
  const st = document.createElement('style');
  st.textContent = `
    .method-status { border-radius: 12px; padding: 10px 14px; margin: -8px 0 16px; font-size: 13px; font-weight: 600; }
    .method-status.ok { background: var(--green-pale); color: var(--green); }
    .method-status.ng { background: #fff4e5; color: var(--orange); }
    .method-status.wait { background: #f0ede8; color: var(--muted); }
  `;
  document.head.appendChild(st);
})();

// "1627" "CP：1627" "ｃｐ1627" → "CP1627"
function normCp(s) {
  let v = String(s || '')
    .replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .toUpperCase().replace(/[^0-9A-Z]/g, '');
  if (/^\d+$/.test(v)) v = 'CP' + v;
  const m = v.match(/^CP(\d+)$/);
  if (m) v = 'CP' + m[1].padStart(4, '0');
  return v;
}

function parseMethodCode(raw) {
  const m = String(raw).match(/^MTH:(.*)$/i);
  if (!m) return null;
  const [cp, name, rev] = m[1].split('|');
  if (!cp) return null;
  return { cp: normCp(cp), name: (name || '').trim(), rev: (rev || '').trim() };
}

function getMethod() {
  try { return JSON.parse(localStorage.getItem('mt') || 'null'); } catch (e) { return null; }
}
// 照合済みの記録が「いま読み込んでいる製品」のものかどうか
function methodOk() {
  const mt = getMethod();
  return !!(mt && currentProduct && mt.cp === normCp(currentProduct.code));
}

function handleMethodScan(method) {
  if (!currentProduct) {
    setFeedback('ng');
    showMethodModal('📋', '先に製造指示書を読んでください', '製造方法のQRは、製造指示書のQRを読んだあとに読み取ってください');
    return;
  }
  const time = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const label = '製造方法：' + (method.name || method.cp);

  if (method.cp === normCp(currentProduct.code)) {
    localStorage.setItem('mt', JSON.stringify({ cp: method.cp, name: method.name, rev: method.rev, time }));
    logs.unshift({ result: 'ok', name: label, code: method.cp, time });
    save();
    setFeedback('ok');
    logToSheet(label, method.cp, 'OK', '―');
    renderMethodResult(true, method);
  } else {
    // 違う紙を読んだら、前に照合済みでも「未照合」に戻す（正しい紙を読み直させる）
    localStorage.removeItem('mt');
    logs.unshift({ result: 'ng', name: label, code: method.cp, time });
    save();
    setFeedback('ng');
    logToSheet(label, method.cp, 'NG', '―');
    renderMethodResult(false, method);
  }
}

function renderMethodResult(ok, method) {
  const head = ok ? `
    <div class="result-card ok">
      <span class="result-icon">📄</span>
      <div class="result-title">製造方法 OK！</div>
      <div class="result-name">${currentProduct.name}</div>
      <div class="result-msg">製造指示書と製造方法のCP番号が一致しました<br>${method.cp}${method.rev ? ' ／ 改訂 ' + method.rev : ''}</div>
    </div>` : `
    <div class="result-card error">
      <span class="result-icon">❌</span>
      <div class="result-title">製造方法が違います！</div>
      <div class="result-msg" style="text-align:left;display:inline-block;">
        製造指示書：${normCp(currentProduct.code)}　${currentProduct.name}<br>
        製造方法　：${method.cp}　${method.name}
      </div>
      <div class="result-msg" style="margin-top:8px;">正しい製造方法の紙を用意して、もう一度読んでください</div>
    </div>`;

  // 次に進むボタン（今の段階に合わせる）
  let next;
  if (allIngredientsDone()) next = ok
    ? `<button class="btn-complete" onclick="renderMakerStep()">製造者の確認へ進む 👥</button>`
    : '';
  else if (getBatchKg() === null) next = `<button class="btn-complete" onclick="renderBatchInput()">生産量の入力へ進む</button>`;
  else if (pendingCode) next = `<button class="btn-complete" onclick="closeWarning()">計量中の原料に戻る</button>`;
  else next = '';

  document.getElementById('app').innerHTML = `
    ${head}
    ${next}
    ${renderProductCard()}
    ${renderProgress()}
    ${renderLog()}
    <button class="btn-reset" onclick="goToStart()">↩️ 最初からやり直す</button>
    <button class="btn-reset" onclick="resetAll()">🔄 リセット</button>
  `;
}

function showMethodModal(icon, title, msg) {
  document.getElementById('modal').innerHTML = `
    <div class="modal-overlay">
      <div class="modal">
        <div class="modal-icon">${icon}</div>
        <div class="modal-title">${title}</div>
        <div class="modal-msg">${msg}</div>
        <button class="modal-btn" onclick="document.getElementById('modal').innerHTML=''">OK</button>
      </div>
    </div>
  `;
}

/* ─── handleCode を差し替え（製造方法QRの分岐を先頭に足す） ───── */
const _handleCodeBeforeMethod = handleCode;
handleCode = function (code) {
  if (!code) return;
  code = code.trim();

  const method = parseMethodCode(code);
  if (method) { handleMethodScan(method); return; }

  _handleCodeBeforeMethod(code);
};

/* ─── 製品カードの下に「製造方法 照合済み／未照合」を出す ───── */
const _renderProductCardBeforeMethod = renderProductCard;
renderProductCard = function () {
  const html = _renderProductCardBeforeMethod();
  if (!currentProduct) return html;
  const mt = getMethod();
  const status = methodOk()
    ? `<div class="method-status ok">📄 製造方法：照合済み${mt.rev ? '（改訂 ' + mt.rev + '）' : ''}</div>`
    : methodSkipped()
    ? `<div class="method-status ng">📄 製造方法：照合せずに進みました</div>`
    : allIngredientsDone()
    ? `<div class="method-status ng">📄 製造方法：まだ照合していません — 製造方法のQRを読んでください</div>`
    : `<div class="method-status wait">📄 製造方法：秤量が終わったら、製造方法のQRを読みます</div>`;
  return html + status;
};

/* ─── 秤量が終わったら、製造人数の入力の前に製造方法QRを読ませる ───── */
// 「照合せずに進む」を押した記録（製品が変わったら無効）
function methodSkipped() {
  return !!(currentProduct && localStorage.getItem('mtskip') === normCp(currentProduct.code));
}

function renderMethodWaitScreen() {
  document.getElementById('app').innerHTML = `
    <div class="wait-card">
      <div class="wait-icon">📄</div>
      <div class="wait-title">製造方法のQRを読んでください</div>
      <div class="wait-sub">全原料の秤量が終わりました<br>製造方法の紙に貼ってある<b>オレンジのQR</b>を読んで<br>「${currentProduct.name}」と同じ製品か確認します</div>
    </div>
    ${REQUIRE_METHOD_CHECK ? '' : `<button class="btn-reset" onclick="skipMethodCheck()">製造方法にQRが無い → 照合せずに進む</button>`}
    ${renderProductCard()}
    ${renderProgress()}
    ${renderLog()}
    <button class="btn-reset" onclick="resetAll()">🔄 リセット</button>
  `;
}

function skipMethodCheck() {
  if (!confirm('製造方法を照合せずに、製造者の確認へ進みますか？')) return;
  const cp = normCp(currentProduct.code);
  localStorage.setItem('mtskip', cp);
  const time = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  logs.unshift({ result: 'ng', name: '製造方法：照合せずに進んだ', code: cp, time });
  save();
  logToSheet('製造方法：照合なし', cp, 'SKIP', '―');
  renderMakerStep();
}

const _renderMakerStepBeforeMethod = renderMakerStep;
renderMakerStep = function () {
  // 製造人数をまだ入れていない（＝製造開始前）で、製造方法が未照合なら先に読ませる
  if (currentProduct && getMakerCount() === null && !methodOk() && !methodSkipped()) {
    renderMethodWaitScreen();
    return;
  }
  _renderMakerStepBeforeMethod();
};

/* ─── 最初の画面の手順に製造方法QRを足す ───── */
const _renderProductScanBeforeMethod = renderProductScan;
renderProductScan = function () {
  _renderProductScanBeforeMethod();
  const app = document.getElementById('app');
  app.innerHTML = app.innerHTML.replace(
    '4. 続けて原料のQRコードをスキャン',
    '4. 続けて原料のQRコードをスキャン<br>5. 秤量が終わったら製造方法のQRコードをスキャン'
  );
};

/* ─── 最初からやり直す時は製造方法の照合もクリア ───── */
const _goToStartBeforeMethod = goToStart;
goToStart = function () { localStorage.removeItem('mt'); localStorage.removeItem('mtskip'); _goToStartBeforeMethod(); };

/* ─── リセット（同じ製品で秤量からやり直す）時も、もう一度照合させる ───── */
const _resetAllBeforeMethod = resetAll;
resetAll = function () { localStorage.removeItem('mt'); localStorage.removeItem('mtskip'); _resetAllBeforeMethod(); };

/* ═══════════ 製造方法QR照合パッチ（v4）ここまで ═══════════ */

// ═══════════════════════════════════════════════════════════
// QRを貼れない原料（例外の原料）パッチ（v5）
//
// 研究室で作る原料など、QRラベルを貼れない原料は ingredients.js の
// NO_QR_INGREDIENTS に登録する。登録した原料だけ、照合進捗の一覧に
// 「目視で確認」ボタンを出し、押すとQRを読んだのと同じ流れで秤量に進む。
// スプレッドシートには「OK（目視）」と記録する。
// ═══════════════════════════════════════════════════════════

const NO_QR = window.NO_QR_INGREDIENTS || (function () {
  try { return JSON.parse(localStorage.getItem('noQrCache')) || {}; } catch (e) { return {}; }
})();
function isNoQr(code) { return Object.prototype.hasOwnProperty.call(NO_QR, code); }

(function () {
  const st = document.createElement('style');
  st.textContent = `
    .noqr-tag { font-size: 10px; color: var(--orange); font-weight: 700; margin-left: 4px; }
    .visual-btn { margin-left: auto; flex: none; padding: 7px 10px; font-size: 12px; font-weight: 700;
      background: #fff; color: var(--orange); border: 1.5px solid var(--orange); border-radius: 8px; cursor: pointer; }
  `;
  document.head.appendChild(st);
})();

// 目視で確認した時だけ、記録の結果を「OK（目視）」にする
let visualChecking = false;
const _logToSheetBeforeNoQr = logToSheet;
logToSheet = function (ingredientName, ingredientCode, result, ingredientAmount) {
  _logToSheetBeforeNoQr(ingredientName, ingredientCode,
    visualChecking && result === 'OK' ? 'OK（目視）' : result, ingredientAmount);
};

function visualCheck(code) {
  const m = MASTER_INGREDIENTS[code];
  if (!m || !currentProduct || currentProduct.ingredients[code] === undefined || !isNoQr(code)) return;
  const ok = confirm(
    'QRを貼れない原料です。目で確認してください。\n\n' +
    '原料名：' + m.name + '\nOPコード：' + code + '\n棚：' + m.shelf + '\n\n' +
    '製造指示書と現物の原料名・OPコードが一致していますか？'
  );
  if (!ok) return;
  visualChecking = true;
  try { handleCode(code); } finally { visualChecking = false; }
}

/* ─── 照合進捗の一覧に「QRなし」と「目視で確認」ボタンを出す ───── */
renderProgress = function () {
  const ings = currentProduct.ingredients;
  const total = Object.keys(ings).length;
  const count = checkedCodes.length;
  const pct = Math.round((count / total) * 100);
  const items = Object.entries(ings).map(([c]) => {
    const master = MASTER_INGREDIENTS[c] || { name: c, shelf: '?' };
    const checked = checkedCodes.includes(c);
    const pending = pendingCode === c;
    const noQr = isNoQr(c);
    return `<div class="ingredient-item ${checked ? 'checked' : pending ? 'pending' : ''}">
      <div class="ingredient-check">${checked ? '✓' : pending ? '⏳' : ''}</div>
      <div class="ingredient-info">
        <div class="ingredient-name">${master.name}${noQr ? '<span class="noqr-tag">QRなし</span>' : ''}${pending ? ' <span style="color:var(--orange);font-size:10px;">計量中</span>' : ''}</div>
        <div class="ingredient-amount">${computeAmount(c)} ／ 棚：${master.shelf}</div>
      </div>
      ${noQr && !checked && !pending ? `<button class="visual-btn" onclick="visualCheck('${c}')">目視で確認</button>` : ''}
    </div>`;
  }).join('');
  return `
    <div class="card">
      <div class="card-title">照合進捗</div>
      <div class="progress-header"><span>進捗</span><span>${count} / ${total}</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="ingredient-list">${items}</div>
    </div>
  `;
};

/* ═══════════ QRを貼れない原料パッチ（v5）ここまで ═══════════ */

// ═══════════════════════════════════════════════════════════
// スキャン高速化パッチ（v3）
//
// 直したこと：
//   ① QRを1フレーム読み落とすたびに、確定までの積み上げが
//      ゼロに戻っていた（これが遅さの主因）。2フレームまで許容する。
//   ② 読み取り枠が150pxと小さく、狙いを合わせるのに時間がかかっていた。
//   ③ 名札QRは、原料QRと同じ「3回連続」を要求していた。
//      名札は1枚ずつ手に持って読むので2回で十分。
//      ※原料QRは3回のまま。誤投入防止の厳しさは一切変わりません。
//   ④ 名札はサーバーの返事を待つ間、無音・無表示だった。
//      読んだ瞬間に「ピッ」と鳴らし、名前を先に出す。
// ═══════════════════════════════════════════════════════════

/* ══════════════════════════════════════════════════════
   ★★★ 直したら APP_VERSION も必ず新しくすること ★★★
   このすぐ下の行です。変え忘れると現場の端末が更新されません。
   ══════════════════════════════════════════════════════ */
const APP_VERSION = 'v4.3 (2026-10-29)';

/* ─── 版数の表示 ───────────────────────────────────────
   端末が古いページをキャッシュしていないか、目で確かめるための表示。 */
(function () {
  const el = document.getElementById('appVer');
  if (el) el.textContent = APP_VERSION + ' ／ 製造者QR・製造方法QR対応';
})();

/* ─── 自動更新 ─────────────────────────────────────────
   iPhoneでホーム画面に追加すると、追加した時点のページが端末内に
   保存され、こちらがファイルを直しても反映されない（iOSの仕様）。
   そこで起動時にGitHub上の最新ファイルを見に行き、APP_VERSION が
   自分と違っていたら、新しいURLで読み込み直す。

   ・通信できないときは何もしない（現場で電波が弱くても止まらない）
   ・localStorageは読み込み直しても消えないので、作業中の進捗は残る
   ・同じ版で何度も読み込み直す無限ループにならないよう1回に制限する  */
async function checkForUpdate() {
  try {
    const base = location.href.split('?')[0].split('#')[0];

    // キャッシュを確実に避けるため、毎回ちがうURLとして取りに行く
    const res = await fetch(base + '?_=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;

    const text = await res.text();
    const m = text.match(/const APP_VERSION = '([^']+)'/);
    if (!m) return;

    const latest = m[1];
    if (latest === APP_VERSION) {
      sessionStorage.removeItem('updTried');   // 最新なので印を消す
      return;
    }

    // 同じ版に対して読み込み直すのは1回だけ（読み込み直しても
    // まだ古いままだった場合に、延々と繰り返さないための保険）
    if (sessionStorage.getItem('updTried') === latest) return;
    sessionStorage.setItem('updTried', latest);

    document.getElementById('app').innerHTML = `
      <div class="wait-card">
        <div class="wait-icon">⬇️</div>
        <div class="wait-title">新しい版に更新しています</div>
        <div class="wait-sub">${APP_VERSION} → ${latest}<br>そのままお待ちください</div>
      </div>
    `;
    location.replace(base + '?v=' + encodeURIComponent(latest));
  } catch (e) {
    // 通信できない場合は、今入っている版のまま普通に使う
  }
}

/* ─── 設定 ───────────────────────────────────────────── */
const CONFIRM_THRESHOLD_MFR = 2;   // 名札QRの確定に必要な回数
const ALLOWED_MISS_FRAMES   = 3;   // これ未満の読み落としなら積み上げを維持する
const QRBOX_SIZE            = 250; // 読み取り枠の最大の大きさ（px）
const SCAN_FPS              = 15;  // 1秒あたりの読み取り回数

/* 読み取り枠の大きさを、カメラ映像の大きさに合わせて決める。
   固定値にすると、映像より枠が大きくなった端末（iPhoneなど画面の狭い機種）で
   カメラの起動そのものが失敗するため、必ず映像に収まるサイズに丸める。 */
function calcQrbox(viewfinderWidth, viewfinderHeight) {
  const shorter = Math.min(viewfinderWidth || 0, viewfinderHeight || 0);
  let size = Math.floor(shorter * 0.8);          // 映像の短い方の8割
  if (!size || size < 0) size = 150;             // 取得できなければ従来値
  size = Math.min(size, QRBOX_SIZE);             // 大きすぎないように上限
  size = Math.max(size, 120);                    // 小さすぎないように下限
  return { width: size, height: size };
}

let missFrames = 0;

function thresholdFor(code) {
  return /^MFR:/i.test(code) ? CONFIRM_THRESHOLD_MFR : CONFIRM_THRESHOLD;
}

/* ─── 読み取った瞬間の合図音（結果が出る前に鳴らす短い音） ─── */
function playTickSound() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  resumeCtx(ctx).then(() => {
    try { beep(ctx, { freq: 1000, duration: 0.06, type: 'square', gain: 0.2 }); } catch (e) {}
  });
}

/* ─── 読み取り成功・失敗時の処理 ───────────────────── */
function onScanSuccess(decodedText) {
  lastFrameTime = Date.now();
  missFrames = 0;
  const code = extractCodeFromScan(decodedText);

  // すでに確定済みの同じQRなら何もしない
  if (code === lastScanCode) { pendingConfirmCode = null; pendingConfirmCount = 0; return; }

  if (code === pendingConfirmCode) {
    pendingConfirmCount++;
  } else {
    pendingConfirmCode = code;
    pendingConfirmCount = 1;
  }

  if (pendingConfirmCount >= thresholdFor(code)) {
    lastScanCode = code;
    pendingConfirmCode = null;
    pendingConfirmCount = 0;
    handleCode(code);
  }
}

function onScanFailure() {
  lastFrameTime = Date.now();
  // 1〜2フレーム読み落としただけで積み上げを捨てると、いつまでも確定しない。
  // 連続して読み落とした時だけリセットする
  missFrames++;
  if (missFrames >= ALLOWED_MISS_FRAMES) {
    pendingConfirmCode = null;
    pendingConfirmCount = 0;
    missFrames = 0;
  }
}

/* ─── toggleScanning を差し替え ───────────────────────── */
toggleScanning = async function () {
  if (isAutoRestarting) return;

  const ctx = getAudioCtx();
  await resumeCtx(ctx);

  if (scanning) {
    await stopScanning();
    return;
  }

  const readerEl = document.getElementById('reader');
  const btn = document.getElementById('scanToggleBtn');
  readerEl.classList.remove('hidden');

  html5QrCode = new Html5Qrcode("reader");
  try {
    try {
      await html5QrCode.start(
        { facingMode: "environment" },
        { fps: SCAN_FPS, qrbox: calcQrbox },
        onScanSuccess,
        onScanFailure
      );
    } catch (e1) {
      // 一部の端末では枠の指定そのものが通らないことがある。
      // その場合は枠なし（映像全体を読み取り対象）で起動し直す。
      html5QrCode = new Html5Qrcode("reader");
      await html5QrCode.start(
        { facingMode: "environment" },
        { fps: SCAN_FPS },
        onScanSuccess,
        onScanFailure
      );
    }

    scanning = true;
    lastFrameTime = Date.now();
    missFrames = 0;
    btn.textContent = '⏹ スキャン停止';
    btn.classList.add('stop');

    zoomSupported = false;
    try {
      const capabilities = html5QrCode.getRunningTrackCapabilities();
      if (capabilities && capabilities.zoom) {
        zoomMin = capabilities.zoom.min;
        zoomMax = capabilities.zoom.max;
        currentZoom = zoomMin;
        zoomSupported = true;
      }
    } catch (e) {}

    await resumeCtx(getAudioCtx());
  } catch (err) {
    alert('カメラを起動できませんでした。\nHTTPSのURLで開いているか、カメラの使用を許可しているか確認してください。\n\nエラー: ' + err);
    readerEl.classList.add('hidden');
  }
};

/* ─── handleMakerScan を差し替え（読んだ瞬間に音と名前を出す） ─── */
handleMakerScan = async function (maker) {
  if (!maker.name) {
    setFeedback('ng');
    showMakerModal(
      '登録されていない名札です',
      `コード：${maker.key}<br>製造メンバーとして登録されていません`
    );
    return;
  }

  // サーバーの返事を待たずに、その場で音を鳴らして名前を出す
  playTickSound();
  document.getElementById('app').innerHTML = `
    <div class="wait-card">
      <div class="wait-icon">👤</div>
      <div class="wait-title">${maker.name} さん</div>
      <div class="wait-sub">確認中...</div>
    </div>
  `;

  let res;
  try {
    res = await gasGet({ action: 'session_maker', makerKey: maker.key, makerName: maker.name });
  } catch (e) {
    setFeedback('ng');
    showMakerModal('サーバーに接続できません', '電波の良い場所でもう一度スキャンしてください');
    renderMakerFallbackScreen();
    return;
  }

  if (!res.success) {
    if (res.error === 'already_done') {
      setFeedback('already');
      renderMakerCompleteScreen(res.session);
      return;
    }
    setFeedback('ng');
    if (res.error === 'no_active_session') {
      showMakerModal(
        'まだバッチが始まっていません',
        '秤量担当が本日の製造人数を入力したあとに<br>もう一度名札をスキャンしてください'
      );
    } else {
      showMakerModal('記録できませんでした', 'もう一度スキャンしてください');
    }
    renderMakerFallbackScreen();
    return;
  }

  if (res.completed) {
    renderMakerCompleteScreen(res.session);
  } else if (res.already) {
    setFeedback('already');
    renderMakerWaitScreen(res.session);
  } else {
    setFeedback('ok');
    renderMakerWaitScreen(res.session);
  }
};

/* ═══════════ スキャン高速化パッチ（v3）ここまで ═══════════ */

/* ─ 起動 ─ */
const hasD  = new URLSearchParams(window.location.search).get('d');

if (hasD) {
  processURL();
} else if (currentProduct) {
  getBatchKg() === null ? renderBatchInput() : renderWait();
} else {
  // この端末には製品データが無い＝製造メンバーのDIGNOで開いた可能性が高い。
  // 進行中のバッチがあるならサーバーに聞いて、いきなり名札スキャンの画面を出す。
  // （「製造指示書をスキャンしてください」と出ていると、指示書が要ると誤解されるため）
  document.getElementById('app').innerHTML = `
    <div class="wait-card">
      <div class="wait-icon">📡</div>
      <div class="wait-title">確認中...</div>
      <div class="wait-sub">進行中の製造があるか確かめています</div>
    </div>
  `;
  gasGet({ action: 'get_session' })
    .then(res => {
      // 返事を待っている間にユーザーが指示書QRを読んでいたら、
      // その画面を上書きしてはいけないので何もしない
      if (currentProduct) return;
      if (res && res.success && res.session && res.session.status === 'collecting') {
        renderMakerWaitScreen(res.session);   // 名札待ちのバッチがある
      } else {
        renderProductScan();                  // 無ければ従来どおり
      }
    })
    .catch(() => { if (!currentProduct) renderProductScan(); });
}

/* 起動のたびに、新しい版が出ていないか確認する。
   ただし ?d= 付き（標準カメラでQRを読んで開いた場合）は、
   読み込み直すとそのコードが失われるので確認しない。 */
if (!hasD) checkForUpdate();
</script>
