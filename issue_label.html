<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>原料QRラベル発行</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<!-- 原料一覧は ingredients.js（全ツール共通）から読む。
     開くたびに最新を取りに行き、通信できない時は前回の控え（端末内）を使う。 -->
<script>document.write('<script src="ingredients.js?t=' + Date.now() + '"><\/script>');</script>
<script>
if (!window.INGREDIENT_MASTER) {
  try { window.INGREDIENT_MASTER = JSON.parse(localStorage.getItem('ingredientMasterCache')); } catch (e) {}
  if (!window.INGREDIENT_MASTER) {
    window.INGREDIENT_MASTER = [];
    alert('原料一覧（ingredients.js）を読み込めませんでした。\n電波の良い場所で開き直してください。');
  }
}
</script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f4f1eb; padding: 16px; }

.header { text-align: center; margin-bottom: 20px; }
.header-brand { font-size: 11px; letter-spacing: .2em; color: #888; margin-bottom: 4px; }
.header-title { font-size: 20px; font-weight: 700; color: #2d6a4f; }

.card { background: #fff; border-radius: 14px; padding: 18px; border: 1px solid #e0dbd0; margin-bottom: 16px; }
.card-title { font-size: 11px; font-weight: 700; letter-spacing: .15em; color: #888; margin-bottom: 14px; }

label { display: block; font-size: 12px; color: #555; margin-bottom: 4px; }
input, select {
  width: 100%; padding: 12px; font-size: 15px;
  border: 1.5px solid #e0dbd0; border-radius: 10px;
  margin-bottom: 14px; -webkit-appearance: none;
  background: #fff;
}
input:focus, select:focus { outline: none; border-color: #2d6a4f; }

.search-wrap { position: relative; }
#searchInput { margin-bottom: 4px; }
#dropdown {
  display: none; position: absolute; top: 100%; left: 0; right: 0;
  background: #fff; border: 1.5px solid #2d6a4f; border-radius: 10px;
  max-height: 240px; overflow-y: auto; z-index: 100; box-shadow: 0 4px 16px rgba(0,0,0,0.12);
}
.drop-item {
  padding: 10px 14px; cursor: pointer; border-bottom: 1px solid #f0ede8; font-size: 13px;
}
.drop-item:last-child { border-bottom: none; }
.drop-item:hover, .drop-item.active { background: #e8f6ec; }
.drop-op { font-size: 11px; color: #888; margin-left: 6px; font-family: monospace; }

.info-row { display: flex; justify-content: space-between; padding: 7px 0;
  border-bottom: 1px solid #f0ede8; font-size: 13px; }
.info-row:last-child { border-bottom: none; }
.info-label { color: #888; }
.info-value { font-weight: 600; color: #1a1a1a; font-family: monospace; }

.btn { width: 100%; padding: 16px; background: #2d6a4f; border: none; border-radius: 12px;
  font-size: 16px; font-weight: 700; color: #fff; cursor: pointer; margin-bottom: 8px;
  -webkit-appearance: none; }
.btn:disabled { background: #ccc; cursor: not-allowed; }
.btn-print { background: #1a5276; }
.btn-reset { background: #fff; border: 2px solid #e0dbd0; color: #888;
  font-size: 14px; font-weight: 500; }

/* プレビューエリア */
#preview { display: none; }
.label-preview {
  background: #fff; border: 2px solid #2d6a4f; border-radius: 14px;
  padding: 16px; text-align: center; margin-bottom: 16px;
}
.label-header {
  background: #2d6a4f; color: #fff; font-size: 13px; font-weight: 700;
  padding: 8px; border-radius: 8px; margin-bottom: 14px; letter-spacing: .05em;
}
#qr-canvas { margin: 0 auto 14px; display: flex; justify-content: center; }
/* QRは3.5cm角（スマホで読める大きさを保ちつつ、ラベルを小さくする） */
#qr-canvas img, #qr-canvas canvas { width: 35mm !important; height: 35mm !important; image-rendering: pixelated; }
.label-name { font-size: 18px; font-weight: 900; color: #1a1a1a; margin-bottom: 6px; }
/* OPコード・棚番・受入日・ロットも、現場で読みやすいよう原料名と同じ大きさにする */
.label-sub { font-size: 18px; font-weight: 900; color: #1a1a1a; margin-bottom: 4px; }
.label-lot { font-size: 18px; font-weight: 900; color: #1a1a1a; margin-bottom: 4px; }
.label-divider { border: none; border-top: 1px solid #e0dbd0; margin: 10px 0; }
.label-url { font-size: 9px; color: #aaa; word-break: break-all; }

/* 印刷スタイル */
@media print {
  body { background: #fff; padding: 0; }
  .no-print { display: none !important; }
  #preview { display: block !important; }
  .label-preview {
    border: 1px solid #999; page-break-inside: avoid;
    width: 80mm; margin: 0 auto;
  }
}
</style>
</head>
<body>

<div class="header no-print">
  <div class="header-brand">原料管理システム</div>
  <div class="header-title">原料QRラベル発行</div>
</div>

<div class="card no-print">
  <div class="card-title">① 原料を選ぶ</div>
  <div class="search-wrap">
    <label>原料名またはOPコードで検索</label>
    <input type="text" id="searchInput" placeholder="例：スクワラン / 00135" autocomplete="off">
    <div id="dropdown"></div>
  </div>
  <div id="selected-info" style="display:none;">
    <div class="info-row"><span class="info-label">原料名</span><span class="info-value" id="sel-name">-</span></div>
    <div class="info-row"><span class="info-label">OPコード</span><span class="info-value" id="sel-op">-</span></div>
    <div class="info-row"><span class="info-label">棚番</span><span class="info-value" id="sel-shelf">-</span></div>
  </div>
</div>

<div class="card no-print" id="lot-card" style="display:none;">
  <div class="card-title">② ロット番号・受入日を入力</div>
  <label>受入日</label>
  <input type="date" id="inputDate">
  <label>ロット番号</label>
  <input type="text" id="inputLot" placeholder="例：2026-08-001">
  <button class="btn" id="generateBtn" onclick="generateQR()">QRラベルを生成する</button>
</div>

<div id="preview">
  <div class="label-preview">
    <div class="label-header">原料 QR ラベル</div>
    <div id="qr-canvas" style="display:inline-block;"></div>
    <div class="label-name" id="prev-name"></div>
    <hr class="label-divider">
    <div class="label-sub" id="prev-op"></div>
    <div class="label-sub" id="prev-shelf"></div>
    <div class="label-lot" id="prev-date"></div>
    <div class="label-lot" id="prev-lot"></div>
  </div>
  <button class="btn btn-print no-print" onclick="window.print()">🖨️ このラベルを印刷する</button>
  <button class="btn btn-reset no-print" onclick="resetForm()">↩️ 別の原料を発行する</button>
</div>

<script>
// 原料一覧は ingredients.js（全ツール共通）で管理する
const INGREDIENTS = INGREDIENT_MASTER;
// 今日の日付をデフォルトにセット
document.getElementById('inputDate').value = new Date().toISOString().slice(0, 10);

let selectedIngredient = null;

// 検索・ドロップダウン
const searchInput = document.getElementById('searchInput');
const dropdown = document.getElementById('dropdown');

searchInput.addEventListener('input', function () {
  const q = this.value.trim().toLowerCase();
  if (!q) { dropdown.style.display = 'none'; return; }

  const matches = INGREDIENTS.filter(([op, name]) =>
    name.toLowerCase().includes(q) || op.includes(q)
  ).slice(0, 20);

  if (!matches.length) { dropdown.style.display = 'none'; return; }

  dropdown.innerHTML = matches.map(([op, name, shelf]) =>
    `<div class="drop-item" onclick="selectItem('${op}','${name.replace(/'/g,"\\'")}','${shelf}')">
      ${name}<span class="drop-op">${op}</span>
    </div>`
  ).join('');
  dropdown.style.display = 'block';
});

document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) dropdown.style.display = 'none';
});

function selectItem(op, name, shelf) {
  selectedIngredient = { op, name, shelf };
  searchInput.value = name;
  dropdown.style.display = 'none';

  document.getElementById('sel-name').textContent = name;
  document.getElementById('sel-op').textContent = op;
  document.getElementById('sel-shelf').textContent = shelf;
  document.getElementById('selected-info').style.display = 'block';
  document.getElementById('lot-card').style.display = 'block';
}

function generateQR() {
  if (!selectedIngredient) return;
  const date = document.getElementById('inputDate').value;
  const lot  = document.getElementById('inputLot').value.trim();

  if (!date) { alert('受入日を入力してください'); return; }
  if (!lot)  { alert('ロット番号を入力してください'); return; }

  const { op, name, shelf } = selectedIngredient;
  const dateDisp = date.replace(/-/g, '/');

  // QRの中身：OPコード・受入日・ロット番号を含むURL形式
  // アプリ側でこれらの情報を読み取ってスプレッドシートに記録できるようにする
  const qrData = `https://sanyruru.github.io/qr-check-production/check_yuru.html?d=${op}&lot=${encodeURIComponent(lot)}&recv=${date}`;

  // プレビューに表示
  document.getElementById('prev-name').textContent = name;
  document.getElementById('prev-op').textContent   = `OPコード：${op}`;
  document.getElementById('prev-shelf').textContent = `棚：${shelf}`;
  document.getElementById('prev-date').textContent  = `受入日：${dateDisp}`;
  document.getElementById('prev-lot').textContent   = `ロット：${lot}`;

  // QR生成（qrcodejs を使用）
  try {
    const container = document.getElementById('qr-canvas');
    container.innerHTML = ''; // 前回のQRをクリア
    new QRCode(container, {
      text: qrData,
      width: 400,   // 3.5cm角で印刷してもぼやけないよう、大きめに作って縮める
      height: 400,
      colorDark: '#000000',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });
    document.getElementById('preview').style.display = 'block';
    document.getElementById('lot-card').style.display = 'none';
    document.querySelector('.card.no-print').style.display = 'none';
    window.scrollTo(0, 0);
  } catch(err) {
    alert('QR生成エラー: ' + err);
  }
}

function resetForm() {
  selectedIngredient = null;
  searchInput.value = '';
  document.getElementById('inputLot').value = '';
  document.getElementById('inputDate').value = new Date().toISOString().slice(0, 10);
  document.getElementById('selected-info').style.display = 'none';
  document.getElementById('lot-card').style.display = 'none';
  document.getElementById('preview').style.display = 'none';
  document.querySelector('.card.no-print').style.display = 'block';
}
</script>
</body>
</html>
