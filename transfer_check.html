<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>原料移し替え照合</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<!-- 原料一覧は ingredients.js（全ツール共通）から読む。
     開くたびに最新を取りに行き、通信できない時は前回の控え（端末内）を使う。 -->
<script>document.write('<script src="ingredients.js?t=' + Date.now() + '"><\/script>');</script>
<script>
if (!window.INGREDIENT_MASTER) {
  try { window.INGREDIENT_MASTER = JSON.parse(localStorage.getItem('ingredientMasterCache')); } catch (e) {}
  if (!window.INGREDIENT_MASTER) {
    window.INGREDIENT_MASTER = [];
    alert('原料一覧（ingredients.js）を読み込めませんでした。\n電波の良い場所で開き直してください。');
  }
}
</script>
<style>
:root {
  --green:#2d6a4f; --green-l:#52b788; --green-p:#d8f3dc;
  --red:#c1121f; --red-p:#ffe8e8;
  --orange:#e76f00; --orange-p:#fff4e8;
  --bg:#f4f1eb; --surface:#ffffff; --text:#1a1a1a; --muted:#888; --border:#e0dbd0;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Helvetica Neue',Arial,sans-serif; background:var(--bg); min-height:100vh; padding:16px; }

.header { text-align:center; margin-bottom:16px; }
.header-brand { font-size:11px; letter-spacing:.2em; color:var(--muted); margin-bottom:4px; }
.header-title { font-size:18px; font-weight:700; color:var(--green); }
.header-ver { font-size:10px; color:var(--muted); margin-top:3px; font-family:monospace; }

.scanner-card { background:var(--surface); border-radius:14px; padding:16px; border:1.5px solid var(--green-l); margin-bottom:16px; }
.card-title { font-size:11px; font-weight:700; letter-spacing:.15em; color:var(--muted); margin-bottom:12px; }
#reader { width:100%; max-width:380px; margin:0 auto 12px; border-radius:10px; overflow:hidden; }
#reader.hidden { display:none; }
.btn-scan { width:100%; padding:16px; background:var(--green); border:none; border-radius:12px; font-size:16px; font-weight:700; color:white; cursor:pointer; -webkit-appearance:none; }
.btn-scan.stop { background:var(--muted); }
.scan-hint { font-size:12px; color:var(--muted); text-align:center; margin-top:8px; line-height:1.5; }

.step-card { background:var(--surface); border-radius:14px; padding:20px; border:1px solid var(--border); margin-bottom:16px; text-align:center; }
.step-num { display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:50%; background:var(--green); color:white; font-size:18px; font-weight:900; margin-bottom:12px; }
.step-num.done { background:var(--green-l); }
.step-num.pending { background:var(--border); color:var(--muted); }
.step-title { font-size:15px; font-weight:700; color:var(--text); margin-bottom:6px; }
.step-sub { font-size:13px; color:var(--muted); line-height:1.6; }

.result-card { border-radius:16px; padding:24px; text-align:center; margin-bottom:16px; animation:popIn .4s cubic-bezier(.34,1.56,.64,1); }
@keyframes popIn { 0%{transform:scale(.85);opacity:0} 100%{transform:scale(1);opacity:1} }
.result-card.ok { background:var(--green); color:white; }
.result-card.error { background:var(--red); color:white; animation:popIn .4s cubic-bezier(.34,1.56,.64,1), shake .5s ease .4s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)} }
.result-icon { font-size:52px; margin-bottom:10px; display:block; }
.result-title { font-size:26px; font-weight:900; margin-bottom:6px; }
.result-msg { font-size:14px; opacity:.85; margin-top:8px; line-height:1.6; }

.info-card { background:var(--surface); border-radius:14px; padding:16px; border:1px solid var(--border); margin-bottom:16px; }
.info-row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; }
.info-row:last-child { border-bottom:none; }
.info-label { color:var(--muted); }
.info-value { font-weight:600; color:var(--text); font-family:monospace; }

.btn-reset { width:100%; padding:14px; background:var(--surface); border:2px solid var(--border); border-radius:12px; font-size:14px; font-weight:500; color:var(--muted); cursor:pointer; margin-bottom:8px; -webkit-appearance:none; }

#flash { position:fixed; top:0; left:0; right:0; bottom:0; pointer-events:none; z-index:50; opacity:0; }
#flash.ok  { animation:flashG .45s forwards; }
#flash.err { animation:flashR .45s forwards; }
@keyframes flashG { 0%{opacity:1;background:rgba(82,183,136,.4)} 100%{opacity:0;background:rgba(82,183,136,0)} }
@keyframes flashR { 0%{opacity:1;background:rgba(193,18,31,.4)}  100%{opacity:0;background:rgba(193,18,31,0)} }
</style>
</head>
<body>

<div class="header">
  <div class="header-brand">原料管理システム</div>
  <div class="header-title">原料 移し替え照合</div>
  <div class="header-ver">v1.2 (2026-10-29) ／ ロット照合対応</div>
</div>

<div class="scanner-card">
  <div class="card-title">QRスキャナー</div>
  <div id="reader" class="hidden"></div>
  <button id="scanBtn" class="btn-scan" onclick="toggleScanning()">📷 スキャン開始</button>
  <div class="scan-hint">1つ目：一斗缶のQR　→　2つ目：小分け容器のQRの順に読んでください</div>
</div>

<div id="app"></div>
<div id="flash"></div>

<script>
// 原料一覧は ingredients.js（全ツール共通）で管理する
const INGREDIENTS = INGREDIENT_MASTER;
const MASTER = {};
INGREDIENTS.forEach(function([op, name, shelf]) { MASTER[op] = { name, shelf }; });

// 状態
let step = 0;        // 0=待機 1=1本目スキャン済み 2=照合完了
let first = null;    // 1本目のスキャン情報

// QRスキャナー
let html5QrCode = null, scanning = false, lastCode = null;
let pendingCode = null, pendingCount = 0;
const THRESHOLD = 2;

function extractInfo(raw) {
  raw = raw.trim();
  try {
    const url = new URL(raw);
    const op   = url.searchParams.get('d') || '';
    const lot  = url.searchParams.get('lot')  || '';
    const recv = url.searchParams.get('recv') || '';
    if (op) return { op: op.trim(), lot, recv };
  } catch(e) {}
  // MFR:系は無視
  if (/^MFR:/i.test(raw)) return null;
  // 5桁数字だけの場合
  if (/^\d{5}$/.test(raw)) return { op: raw, lot: '', recv: '' };
  return null;
}

function getAudioCtx() {
  if (!window._actx) {
    try { window._actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  return window._actx;
}
function beep(freq, dur, type, gain, delay) {
  const ctx = getAudioCtx(); if (!ctx) return;
  if (ctx.state === 'suspended') ctx.resume();
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type || 'sine'; o.frequency.value = freq; g.gain.value = gain || .3;
  o.connect(g); g.connect(ctx.destination);
  o.start(ctx.currentTime + (delay||0)); o.stop(ctx.currentTime + (delay||0) + dur);
}
function playOk()  { beep(880,.12,'sine',.25); beep(1320,.15,'sine',.25,0.12); }
function playNg()  { beep(160,.35,'sawtooth',.3); }
function playPip() { beep(1000,.06,'square',.2); }

function flash(type) {
  const el = document.getElementById('flash');
  el.className = ''; void el.offsetWidth; el.className = type;
}

async function toggleScanning() {
  const ctx = getAudioCtx();
  if (ctx && ctx.state === 'suspended') await ctx.resume();
  if (scanning) { await stopScanning(); return; }

  const readerEl = document.getElementById('reader');
  readerEl.classList.remove('hidden');
  html5QrCode = new Html5Qrcode('reader');
  try {
    await html5QrCode.start(
      { facingMode: 'environment' },
      { fps: 15, qrbox: function(w, h) {
        const s = Math.min(w, h) * 0.8;
        return { width: Math.min(s, 250), height: Math.min(s, 250) };
      }},
      function(decoded) {
        lastCode = decoded;
        const code = decoded.trim();
        if (code === pendingCode) { pendingCount++; }
        else { pendingCode = code; pendingCount = 1; }
        if (pendingCount >= THRESHOLD) {
          pendingCode = null; pendingCount = 0;
          handleScan(code);
        }
      },
      function() { pendingCode = null; pendingCount = 0; }
    );
    scanning = true;
    document.getElementById('scanBtn').textContent = '⏹ スキャン停止';
    document.getElementById('scanBtn').classList.add('stop');
    if (ctx && ctx.state === 'suspended') await ctx.resume();
  } catch(err) {
    alert('カメラを起動できませんでした: ' + err);
    readerEl.classList.add('hidden');
  }
}

async function stopScanning() {
  if (html5QrCode) {
    try { await html5QrCode.stop(); await html5QrCode.clear(); } catch(e) {}
  }
  scanning = false; lastCode = null; pendingCode = null; pendingCount = 0;
  document.getElementById('reader').classList.add('hidden');
  document.getElementById('scanBtn').textContent = '📷 スキャン開始';
  document.getElementById('scanBtn').classList.remove('stop');
}

function handleScan(raw) {
  const info = extractInfo(raw);
  if (!info) return; // 製造者QRなど無関係なコードは無視

  const master = MASTER[info.op];
  if (!master) {
    // 登録外のOPコード
    flash('err'); playNg();
    document.getElementById('app').innerHTML =
      '<div class="result-card error">' +
      '<span class="result-icon">❌</span>' +
      '<div class="result-title">未登録の原料</div>' +
      '<div class="result-msg">OPコード ' + escH(info.op) + ' は原料マスターに登録されていません</div>' +
      '</div>' +
      resetBtn();
    return;
  }

  if (step === 0) {
    // 1本目スキャン
    first = { op: info.op, lot: info.lot, recv: info.recv, name: master.name, shelf: master.shelf };
    step = 1;
    playPip();
    renderStep1Done();
  } else if (step === 1) {
    // 2本目スキャン → 照合
    const match = (info.op === first.op);
    // ロットも照合する：新しい一斗缶が入ったら小分け容器のラベルも新しいロットに貼り替える決まり。
    // 一斗缶側にロットがある時だけ比べる（容器側にロットが無い＝古い形式のラベルのまま、もNGにする）
    const lotMatch = !first.lot || info.lot.trim() === first.lot.trim();
    step = 2;
    if (match && lotMatch) {
      flash('ok'); playOk();
      renderOk(info, master);
    } else if (match) {
      flash('err'); playNg();
      renderLotNg(info, master);
    } else {
      flash('err'); playNg();
      renderNg(info, master);
    }
  }
}

function renderWait() {
  document.getElementById('app').innerHTML =
    '<div class="step-card">' +
    '<div class="step-num">1</div>' +
    '<div class="step-title">一斗缶のQRを読む</div>' +
    '<div class="step-sub">まず一斗缶に貼ってあるQRラベルをスキャンしてください</div>' +
    '</div>' +
    '<div class="step-card">' +
    '<div class="step-num pending">2</div>' +
    '<div class="step-title" style="color:var(--muted)">小分け容器のQRを読む</div>' +
    '<div class="step-sub">1本目を読んだあと、移し先の容器のQRをスキャンします</div>' +
    '</div>';
}

function renderStep1Done() {
  document.getElementById('app').innerHTML =
    '<div class="result-card ok" style="padding:16px;">' +
    '<span style="font-size:32px;display:block;margin-bottom:6px;">✅</span>' +
    '<div style="font-size:18px;font-weight:900;">1本目 読み取り完了</div>' +
    '<div style="font-size:14px;opacity:.9;margin-top:4px;">' + escH(first.name) + '</div>' +
    '</div>' +
    '<div class="info-card">' +
    '<div class="card-title">読み取った原料</div>' +
    infoRow('原料名', first.name) +
    infoRow('OPコード', first.op) +
    infoRow('棚番', first.shelf) +
    (first.recv ? infoRow('受入日', first.recv) : '') +
    (first.lot  ? infoRow('ロット', first.lot)  : '') +
    '</div>' +
    '<div class="step-card">' +
    '<div class="step-num">2</div>' +
    '<div class="step-title">次に小分け容器のQRを読む</div>' +
    '<div class="step-sub">移し先の容器に貼ってあるQRラベルをスキャンしてください</div>' +
    '</div>';
}

function renderOk(info, master) {
  document.getElementById('app').innerHTML =
    '<div class="result-card ok">' +
    '<span class="result-icon">✅</span>' +
    '<div class="result-title">照合 OK！</div>' +
    '<div class="result-msg">一斗缶と小分け容器の原料' + (first.lot ? '・ロット番号' : '') + 'が一致しています<br>安全に移し替えできます</div>' +
    '</div>' +
    '<div class="info-card">' +
    '<div class="card-title">照合結果</div>' +
    infoRow('原料名', master.name) +
    infoRow('OPコード', info.op) +
    infoRow('棚番', master.shelf) +
    (info.recv ? infoRow('受入日', info.recv) : '') +
    (info.lot  ? infoRow('ロット', info.lot)  : '') +
    '</div>' +
    resetBtn();
}

function renderNg(info, master) {
  document.getElementById('app').innerHTML =
    '<div class="result-card error">' +
    '<span class="result-icon">❌</span>' +
    '<div class="result-title">原料が違います！</div>' +
    '<div class="result-msg">' +
    '一斗缶：' + escH(first.name) + '<br>' +
    '容器　：' + escH(master.name) + '<br><br>' +
    'この組み合わせでは移し替えできません' +
    '</div>' +
    '</div>' +
    '<div class="info-card">' +
    '<div class="card-title">1本目（一斗缶）</div>' +
    infoRow('原料名', first.name) +
    infoRow('OPコード', first.op) +
    '</div>' +
    '<div class="info-card">' +
    '<div class="card-title">2本目（小分け容器）</div>' +
    infoRow('原料名', master.name) +
    infoRow('OPコード', info.op) +
    '</div>' +
    resetBtn();
}

// 原料は同じだが、ロット番号が違う（小分け容器のラベルを新しいロットに貼り替え忘れている）
function renderLotNg(info, master) {
  document.getElementById('app').innerHTML =
    '<div class="result-card error">' +
    '<span class="result-icon">⚠️</span>' +
    '<div class="result-title">ロット番号が違います！</div>' +
    '<div class="result-msg">' +
    '原料は同じ（' + escH(master.name) + '）ですが、<br>ロット番号が一致しません<br><br>' +
    '一斗缶：' + escH(first.lot) + '<br>' +
    '容器　：' + escH(info.lot || '（ロット番号なし）') + '<br><br>' +
    '小分け容器の古いラベルを剥がし、<br>新しいロットのラベルを貼ってから<br>もう一度①から読んでください' +
    '</div>' +
    '</div>' +
    '<div class="info-card">' +
    '<div class="card-title">1本目（一斗缶）</div>' +
    infoRow('原料名', first.name) +
    infoRow('ロット', first.lot) +
    (first.recv ? infoRow('受入日', first.recv) : '') +
    '</div>' +
    '<div class="info-card">' +
    '<div class="card-title">2本目（小分け容器）</div>' +
    infoRow('原料名', master.name) +
    infoRow('ロット', info.lot || '（なし）') +
    (info.recv ? infoRow('受入日', info.recv) : '') +
    '</div>' +
    resetBtn();
}

function infoRow(label, value) {
  return '<div class="info-row"><span class="info-label">' + escH(label) +
    '</span><span class="info-value">' + escH(value) + '</span></div>';
}

function resetBtn() {
  return '<button class="btn-reset" onclick="resetAll()">↩️ 次の移し替えへ</button>';
}

function escH(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function resetAll() {
  step = 0; first = null;
  renderWait();
}

// 起動
renderWait();
</script>
</body>
</html>
